# Cogeto per-tenant stack (the specification: `docker compose up` is the contract).
# Seven always-on containers plus one-shot init jobs plus the opt-in profiles
# (`mail`, `research`, `redaction`, `consoles`, `demo`, `dev-seed`). Inbound
# SMTP moved behind the `mail` profile in audit 2.0 SEC-14, so a default
# `docker compose up` no longer runs an internet-facing mail listener.
# Works with zero configuration on a fresh clone; every variable can be
# overridden via .env (see .env.example).

name: cogeto

# ── Resource ceilings (security audit 2.0, SEC-17) ────────────────────────────
#
# No container had a memory, CPU or pid ceiling, so one runaway process could
# take the instance down with it: the redaction sidecar alone holds ~1 GB RSS,
# and a Qdrant index rebuild, a document-parsing burst or a 25 MB mail delivery
# could OOM-kill Postgres.
#
# Every service now carries `mem_limit` / `cpus` / `pids_limit`. These are
# CEILINGS, not reservations: nothing is set aside, so the stack still fits the
# 8 GB / 2 vCPU minimum the operator script enforces. They are sized from what
# each service actually uses with generous headroom, because a limit that kills
# a service under normal load is worse than no limit at all:
#
#   worker  3g  — the widest range: 25 MB document parses, embedding batches
#                 and Node's own heap growth. Deliberately the largest cap.
#   app     2g  — request handling plus SSE streams; steady state is far below.
#   postgres/qdrant 2g — room for a real corpus and an index rebuild.
#   redaction 2g — the documented ~0.7-1 GB spaCy model, doubled.
#   minio/zitadel 1g, searxng 1g, mail 512m, caddy 256m — measured steady state
#                 is a small fraction of each.
#   one-shot init jobs 128m-1g — they do one bounded thing and exit.
#
# `cpus` is 1.5 for the heavy services and 1.0 for the rest: on the 2 vCPU
# minimum that still leaves the scheduler room, and on a larger instance it
# stops one service from monopolising the box. `pids_limit` bounds fork bombs
# in anything that shells out.

services:
  # ── Edge ────────────────────────────────────────────────────────────────────
  caddy:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: caddy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      app:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    restart: unless-stopped

  # ── Application processes (same image, different commands) ─────────────────
  app:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: runtime
    # --max-old-space-size tells V8 about the cgroup ceiling above. Without it
    # Node sizes its heap from the HOST's memory and grows past mem_limit, and
    # the kernel SIGKILLs the container instead of V8 collecting harder. Set
    # below the limit, not at it: off-heap allocation (Buffers, the raw bytes of
    # an upload or a mail body) counts against the container but never against
    # the heap budget, so the gap is the off-heap working room.
    command: ['node', '--max-old-space-size=1536', 'project/src/dist/entrypoints/app.js']
    environment: &cogeto-env
      COGETO_HTTP_PORT: 3000
      # SEC-1: the runtime connects as the least-privilege cogeto_app role
      # (DML only, no DDL, no TRIGGER, no access to the zitadel database),
      # provisioned by the db-init one-shot. The superuser credential is no
      # longer handed to any long-running service. The migrate service below
      # overrides this URL with the cogeto_migrate schema owner.
      COGETO_DATABASE_URL: postgres://cogeto_app:${COGETO_APP_DB_PASSWORD:-cogeto-dev-app-db-password}@postgres:5432/cogeto
      COGETO_QDRANT_URL: http://qdrant:6333
      # Qdrant API key. Empty on the default internal-only stack; set it
      # (and it is applied to the qdrant service) before exposing Qdrant.
      COGETO_QDRANT_API_KEY: ${COGETO_QDRANT_API_KEY:-}
      COGETO_S3_URL: http://minio:9000
      # Browser-reachable S3 origin for presigned download URLs (O1;
      #): served by Caddy at https://s3.localhost with the Host
      # header preserved, so MinIO's SigV4 host check matches. Add the local DNS
      # entry (see) before downloads resolve in the browser.
      COGETO_S3_PUBLIC_URL: ${COGETO_S3_PUBLIC_URL:-https://s3.localhost}
      # Object-storage credentials + bucket for the memory module's S3 client
      # (deletion saga object removal, encryption health check). SEC-2: this is
      # the SCOPED application credential provisioned by minio-init (put, get,
      # delete, list, encryption-read on the cogeto bucket only) — never the
      # MinIO root credential.
      COGETO_S3_ACCESS_KEY: ${COGETO_S3_ACCESS_KEY:-cogeto-app}
      COGETO_S3_SECRET_KEY: ${COGETO_S3_SECRET_KEY:-cogeto-dev-app-password}
      COGETO_S3_BUCKET: cogeto
      # Instance signing keypair (deletion receipts, spec §11.1) — generated by the
      # migrate init job on first boot.: the internet-facing app mounts
      # ONLY the public half (see volumes below) and asserts the private key is
      # absent at boot; the worker keeps the full pair.
      COGETO_INSTANCE_KEY_DIR: /instance-keys
      COGETO_ASSERT_NO_PRIVATE_KEY: '1'
      COGETO_OIDC_ISSUER: https://${COGETO_EXTERNAL_DOMAIN:-localhost}
      COGETO_OIDC_INTERNAL_URL: http://zitadel:8080
      COGETO_OIDC_EXTERNAL_DOMAIN: ${COGETO_EXTERNAL_DOMAIN:-localhost}
      COGETO_WEB_CONFIG_FILE: /web-config/config.json
      # Optional: without it the model gateway boots unconfigured and fails on use
      # with a typed error. Model calls start with the Notes pipeline (Session 2).
      COGETO_MISTRAL_API_KEY: ${COGETO_MISTRAL_API_KEY:-}
      # Per-task model tiers and the embedding model —
      # each falls back to the config default when unset.
      COGETO_MISTRAL_MODEL_PIPELINE: ${COGETO_MISTRAL_MODEL_PIPELINE:-}
      COGETO_MISTRAL_MODEL_ANSWER: ${COGETO_MISTRAL_MODEL_ANSWER:-}
      COGETO_MISTRAL_EMBED_MODEL: ${COGETO_MISTRAL_EMBED_MODEL:-}
      # Bring-your-own-key providers: preset + per-tier
      # provider/model selection and the OpenAI-compatible/Anthropic keys.
      # Validated at boot; invalid combinations refuse to start.
      COGETO_PROVIDER_PRESET: ${COGETO_PROVIDER_PRESET:-}
      COGETO_PROVIDER_PIPELINE: ${COGETO_PROVIDER_PIPELINE:-}
      COGETO_MODEL_PIPELINE: ${COGETO_MODEL_PIPELINE:-}
      COGETO_PROVIDER_ANSWER: ${COGETO_PROVIDER_ANSWER:-}
      COGETO_MODEL_ANSWER: ${COGETO_MODEL_ANSWER:-}
      COGETO_PROVIDER_EMBEDDINGS: ${COGETO_PROVIDER_EMBEDDINGS:-}
      COGETO_MODEL_EMBEDDINGS: ${COGETO_MODEL_EMBEDDINGS:-}
      # Reading pages that are pictures (V2.1 item 4.1). Opt-in, no default
      # model: both must be set together, and without them the reading ladder
      # stops at local OCR and labels what it could not read.
      COGETO_PROVIDER_VISION: ${COGETO_PROVIDER_VISION:-}
      COGETO_MODEL_VISION: ${COGETO_MODEL_VISION:-}
      # How many pages one document, and one user per day, may escalate to the
      # vision tier. Image inference is the most expensive call the pipeline
      # makes, so it is bounded by construction.
      COGETO_VISION_PAGES_PER_DOCUMENT: ${COGETO_VISION_PAGES_PER_DOCUMENT:-}
      COGETO_VISION_PAGES_PER_USER_DAILY: ${COGETO_VISION_PAGES_PER_USER_DAILY:-}
      COGETO_OPENAI_API_KEY: ${COGETO_OPENAI_API_KEY:-}
      COGETO_OPENAI_BASE_URL: ${COGETO_OPENAI_BASE_URL:-}
      COGETO_ANTHROPIC_API_KEY: ${COGETO_ANTHROPIC_API_KEY:-}
      COGETO_ANTHROPIC_BASE_URL: ${COGETO_ANTHROPIC_BASE_URL:-}
      # Local Ollama runtime: runtime root URL (no /v1), the
      # optional reverse-proxy key, and per-tier timeouts for local inference.
      COGETO_OLLAMA_BASE_URL: ${COGETO_OLLAMA_BASE_URL:-}
      COGETO_OLLAMA_API_KEY: ${COGETO_OLLAMA_API_KEY:-}
      COGETO_OLLAMA_TIMEOUT_PIPELINE_MS: ${COGETO_OLLAMA_TIMEOUT_PIPELINE_MS:-}
      COGETO_OLLAMA_TIMEOUT_ANSWER_MS: ${COGETO_OLLAMA_TIMEOUT_ANSWER_MS:-}
      COGETO_OLLAMA_TIMEOUT_EMBEDDINGS_MS: ${COGETO_OLLAMA_TIMEOUT_EMBEDDINGS_MS:-}
      COGETO_OLLAMA_TIMEOUT_VISION_MS: ${COGETO_OLLAMA_TIMEOUT_VISION_MS:-}
      # Provider-neutral per-tier timeouts: any self-hosted endpoint, not just
      # Ollama (V2.1 item 4.1).
      COGETO_MODEL_TIMEOUT_PIPELINE_MS: ${COGETO_MODEL_TIMEOUT_PIPELINE_MS:-}
      COGETO_MODEL_TIMEOUT_ANSWER_MS: ${COGETO_MODEL_TIMEOUT_ANSWER_MS:-}
      COGETO_MODEL_TIMEOUT_EMBEDDINGS_MS: ${COGETO_MODEL_TIMEOUT_EMBEDDINGS_MS:-}
      COGETO_MODEL_TIMEOUT_VISION_MS: ${COGETO_MODEL_TIMEOUT_VISION_MS:-}
      COGETO_VISION_PROBE_TIMEOUT_MS: ${COGETO_VISION_PROBE_TIMEOUT_MS:-}
      # Reasoning models (Part B of reasoning support): probed at boot, and the
      # detected capability multiplies maxTokens so thinking cannot silently
      # consume an answer's token budget.
      COGETO_REASONING_HEADROOM: ${COGETO_REASONING_HEADROOM:-}
      COGETO_REASONING_PROBE_TIMEOUT_MS: ${COGETO_REASONING_PROBE_TIMEOUT_MS:-}
      COGETO_LOG_LEVEL: ${COGETO_LOG_LEVEL:-info}
      # Ana sandbox. Off by default and FAIL-CLOSED:
      # serving the pre-minted demo session (a token published to anyone) now
      # requires an EXPLICIT COGETO_DEMO_MODE=1 — the app never flips to sandbox
      # mode from the mere presence of a session file. So the demo profile is:
      #   COGETO_DEMO_MODE=1 docker compose --profile demo up
      # COGETO_PRODUCTION=1 hard-refuses the demo seed/reset. NEVER set demo mode
      # on a customer instance.
      COGETO_DEMO_MODE: ${COGETO_DEMO_MODE:-}
      COGETO_PRODUCTION: ${COGETO_PRODUCTION:-}
      COGETO_DEMO_RESET_CRON: ${COGETO_DEMO_RESET_CRON:-0 */6 * * *}
      # Redaction mode (spec §12.2, profile redaction). Off by default. Set
      # REDACTION_ENABLED=1 (with the profile up) to pseudonymize every outbound
      # model call; the gateway then fails closed if the sidecar is unreachable.
      REDACTION_ENABLED: ${REDACTION_ENABLED:-}
      REDACTION_URL: ${REDACTION_URL:-http://redaction:8080}
      # fail-closed assertion: set to 1 to REFUSE boot unless redaction is
      # actually enabled — bringing the redaction profile up while forgetting
      # REDACTION_ENABLED=1 then fails loudly at boot instead of silently sending
      # plaintext to the model provider.
      REDACTION_REQUIRED: ${REDACTION_REQUIRED:-}
      # Inbound email (sender routing per decision
      # 0031). The instance's unique inbound address (ruling 1), the size caps
      # (ruling 6), the shared secret the Haraka queue hook presents to the
      # internal intake (ruling 7), and the SMTP listener address for the app's
      # mail health probe. The DEV token below is for localhost only —
      # provisioning (O6) generates a real one per instance and sets it on BOTH
      # the app and the mail service.
      COGETO_MAIL_INBOUND_ADDRESS: ${COGETO_MAIL_INBOUND_ADDRESS:-capture@in.localhost}
      COGETO_MAIL_MAX_BYTES: ${COGETO_MAIL_MAX_BYTES:-26214400}
      COGETO_MAIL_ATTACHMENTS_MAX_BYTES: ${COGETO_MAIL_ATTACHMENTS_MAX_BYTES:-26214400}
      COGETO_MAIL_INTAKE_TOKEN: ${COGETO_MAIL_INTAKE_TOKEN:-cogeto-dev-mail-token}
      # The bootstrap admin's login email — the operator account is excluded
      # from sender-routed email capture. Must match the
      # Zitadel FirstInstance admin below.
      COGETO_ADMIN_USER_EMAIL: ${ZITADEL_ADMIN_USERNAME:-admin@cogeto.localhost}
      COGETO_MAIL_SMTP_ADDRESS: ${COGETO_MAIL_SMTP_ADDRESS:-mail:2525}
      # Web research (Priority 5 Part A, profile research;/0043).
      # Discovery via the self-hosted SearXNG container (internal network only);
      # unset/unreachable → the API answers "search unavailable", nothing crashes.
      # The fetch knobs bound the narrow fetcher; retention default is clean
      # text + URL (raw-HTML retention off).
      COGETO_SEARXNG_URL: ${COGETO_SEARXNG_URL:-http://searxng:8080}
      COGETO_RESEARCH_RESULT_CAP: ${COGETO_RESEARCH_RESULT_CAP:-8}
      COGETO_RESEARCH_SEARCH_TIMEOUT_SECONDS: ${COGETO_RESEARCH_SEARCH_TIMEOUT_SECONDS:-10}
      COGETO_RESEARCH_FETCH_TIMEOUT_SECONDS: ${COGETO_RESEARCH_FETCH_TIMEOUT_SECONDS:-15}
      COGETO_RESEARCH_FETCH_MAX_BYTES: ${COGETO_RESEARCH_FETCH_MAX_BYTES:-5242880}
      COGETO_RESEARCH_PAGES_PER_RUN: ${COGETO_RESEARCH_PAGES_PER_RUN:-5}
      COGETO_RESEARCH_RETAIN_HTML: ${COGETO_RESEARCH_RETAIN_HTML:-}
      COGETO_DAILY_RESEARCH_SEARCHES: ${COGETO_DAILY_RESEARCH_SEARCHES:-40}
      COGETO_DAILY_RESEARCH_PAGES: ${COGETO_DAILY_RESEARCH_PAGES:-100}
      # Capability visibility (P6.7). The container cannot see
      # which compose profiles are active, so the ACTIVE PROFILE LIST is passed
      # in: set COMPOSE_PROFILES in .env (compose also activates those profiles
      # from it; the operator script's `features` command maintains it). CLI
      # `--profile` flags are invisible here — for one-off dev runs set the
      # explicit COGETO_RESEARCH_ENABLED / COGETO_CONSOLES_ENABLED flags too.
      COGETO_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      COGETO_RESEARCH_ENABLED: ${COGETO_RESEARCH_ENABLED:-}
      # SEC-14: inbound mail is opt-in. The `mail` profile is the normal
      # switch; this flag covers one-off `--profile mail` dev runs, which the
      # container cannot see.
      COGETO_MAIL_ENABLED: ${COGETO_MAIL_ENABLED:-}
      COGETO_CONSOLES_ENABLED: ${COGETO_CONSOLES_ENABLED:-}
      # Overdue threshold for the nightly jobs in the capability registry.
      COGETO_JOBS_OVERDUE_HOURS: ${COGETO_JOBS_OVERDUE_HOURS:-}
    volumes:
      - web-config:/web-config:ro
      #: the app mounts the PUBLIC-KEY-ONLY volume (migrate copies the public
      # half here) — an RCE in the internet-facing app cannot exfiltrate the
      # receipt-signing private key. The worker mounts the full instance-keys.
      - instance-pubkey:/instance-keys:ro
      # Empty on a normal instance (no session file → no demo mode); the
      # demo-seed job (profile demo) writes the demo Principal's session here.
      - demo-config:/demo-config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      # SEC-2: the app's scoped S3 credential is provisioned by minio-init.
      minio-init:
        condition: service_completed_successfully
      zitadel:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      zitadel-init:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 512
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: runtime
    # Heap ceiling below mem_limit: 3g — see the note on `app`. The worker gets
    # the larger share because it is the process that parses 25 MB documents and
    # builds embedding batches, which is also the off-heap pressure the gap
    # between 2304m and 3g is there to absorb.
    command: ['node', '--max-old-space-size=2304', 'project/src/dist/entrypoints/worker.js']
    environment:
      <<: *cogeto-env
      #: run the worker's graphile crons in UTC so the 03:00/03:30/03:40
      # nightly schedule is timezone-stable and a DST transition never skips or
      # double-fires a run (the single-flight advisory lock also guards the
      # double-fire). The app carries no crons, so only the worker pins TZ.
      TZ: UTC
    volumes:
      # The worker keeps the FULL keypair (it signs receipts) —.
      - instance-keys:/instance-keys:ro
      # Demo scheduled reset reuses the session the seed wrote.
      - demo-config:/demo-config:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('fs').statSync('/tmp/worker-heartbeat');process.exit(Date.now()-s.mtimeMs<30000?0:1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      # SEC-2: the worker's scoped S3 credential is provisioned by minio-init.
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── One-shot init jobs ──────────────────────────────────────────────────────
  # Refuses to boot if a known DEV secret guards a non-localhost deployment
  #. Runs before zitadel/migrate/app/worker and is the ONLY process handed
  # every secret (Postgres/MinIO/Zitadel/KMS), so it enforces the rule
  # instance-wide. A no-op on a localhost dev box.
  preflight:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: runtime
    command: ['node', 'project/src/dist/entrypoints/preflight.js']
    environment:
      COGETO_EXTERNAL_DOMAIN: ${COGETO_EXTERNAL_DOMAIN:-localhost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cogeto-dev-password}
      # SEC-1/SEC-2 wave-3 credentials join the known-dev-secret refusal.
      COGETO_APP_DB_PASSWORD: ${COGETO_APP_DB_PASSWORD:-cogeto-dev-app-db-password}
      COGETO_MIGRATE_DB_PASSWORD: ${COGETO_MIGRATE_DB_PASSWORD:-cogeto-dev-migrate-db-password}
      ZITADEL_DB_ADMIN_PASSWORD: ${ZITADEL_DB_ADMIN_PASSWORD:-zitadel-dev-admin-password}
      COGETO_S3_SECRET_KEY: ${COGETO_S3_SECRET_KEY:-cogeto-dev-app-password}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cogeto-dev-password}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-cogeto-dev-key:bxaADytwX4au7d/HYGegSGd0uloQlb30uz6Vh5opUvg=}
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel-dev-password}
      ZITADEL_ADMIN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-DevPassword1!}
      # SEC-21: the preflight can only refuse a dev secret it can SEE, and it
      # skips any variable that is absent. Empty/unset here is fine (research
      # off) — the check simply does not apply.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    restart: 'no'

  migrate:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: runtime
    command: ['node', 'project/src/dist/entrypoints/migrate.js']
    environment:
      <<: *cogeto-env
      # SEC-1: migrations run as the schema OWNER, never as the runtime role
      # and never as the superuser. After each run it re-converges cogeto_app's
      # table-level grants (infrastructure/migrations.ts).
      COGETO_DATABASE_URL: postgres://cogeto_migrate:${COGETO_MIGRATE_DB_PASSWORD:-cogeto-dev-migrate-db-password}@postgres:5432/cogeto
      #: migrate also publishes the PUBLIC half into the app-only volume.
      COGETO_INSTANCE_PUBKEY_DIR: /instance-pubkey
    # The only writer of the instance keypair: generated here once, then the
    # PRIVATE half mounted read-only into the worker and the PUBLIC half into the
    # app (spec §11.1).
    volumes:
      - instance-keys:/instance-keys
      - instance-pubkey:/instance-pubkey
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      instance-keys-init:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
    restart: 'no'

  # Least-privilege Postgres identities (audit 2.0 SEC-1): creates/converges
  # cogeto_app (runtime, DML only), cogeto_migrate (schema owner, migrations
  # only) and zitadel_admin (Zitadel's bootstrap admin — CREATEDB/CREATEROLE,
  # not superuser), revokes PUBLIC connect on both databases, and adopts
  # objects a pre-SEC-1 stack created as the superuser. Idempotent; passwords
  # re-sync from .env on every up, which is what makes them rotatable. This is
  # the ONLY service besides postgres itself that holds the superuser
  # credential.
  db-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    # postgres:17-alpine (same digest as the postgres service — used for psql)
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-cogeto-dev-password}
      PGDATABASE: cogeto
      COGETO_APP_DB_PASSWORD: ${COGETO_APP_DB_PASSWORD:-cogeto-dev-app-db-password}
      COGETO_MIGRATE_DB_PASSWORD: ${COGETO_MIGRATE_DB_PASSWORD:-cogeto-dev-migrate-db-password}
      ZITADEL_DB_ADMIN_PASSWORD: ${ZITADEL_DB_ADMIN_PASSWORD:-zitadel-dev-admin-password}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel-dev-password}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        psql -v ON_ERROR_STOP=1
        --set=app_password="$$COGETO_APP_DB_PASSWORD"
        --set=migrate_password="$$COGETO_MIGRATE_DB_PASSWORD"
        --set=zitadel_admin_password="$$ZITADEL_DB_ADMIN_PASSWORD"
        --set=zitadel_password="$$ZITADEL_DB_PASSWORD"
        -f /db-init/db-init.sql
    volumes:
      - ./project/infra/docker/postgres-init/db-init.sql:/db-init/db-init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      preflight:
        condition: service_completed_successfully
    restart: 'no'

  # The runtime image runs as uid 1000 (node); fresh named volumes are
  # root-owned. Hand both key volumes over before migrate generates the keypair
  # (same pattern as machinekey-init below).
  instance-keys-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    # busybox:stable
    image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    command: ['chown', '-R', '1000:1000', '/instance-keys', '/instance-pubkey']
    volumes:
      - instance-keys:/instance-keys
      - instance-pubkey:/instance-pubkey
    restart: 'no'

  # Creates the bucket, turns on default SSE-S3 encryption, ASSERTS the bucket
  # reports encryption enabled (a misencrypted instance fails compose up instead
  # of silently storing plaintext bytes, audit 3.9), and provisions the SCOPED
  # application credential (SEC-2): a MinIO user limited to the object
  # operations the app actually performs on the cogeto bucket. The root
  # credential exists ONLY here (provisioning) and in the minio service itself;
  # the app and worker never see it. Idempotent: `mc admin user add` re-syncs
  # the secret from .env, the policy is re-created, and the attach tolerates
  # "already attached" but is then VERIFIED via `mc admin user info`. The final
  # check asserts the scoped credential works for object access and is REFUSED
  # by the admin API.
  minio-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    # minio/mc:RELEASE.2025-08-13T08-35-41Z
    # (SEC-35: the comment used to read `latest`, which names no release, so no
    # advisory could ever be matched to what actually runs. Resolved from the
    # pinned digest itself with `docker run --rm --entrypoint sh <digest> -c
    # 'mc --version'`. The digest is unchanged: this is a label, not a bump.)
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      COGETO_S3_ACCESS_KEY: ${COGETO_S3_ACCESS_KEY:-cogeto-app}
      COGETO_S3_SECRET_KEY: ${COGETO_S3_SECRET_KEY:-cogeto-dev-app-password}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000
        "${MINIO_ROOT_USER:-cogeto}" "${MINIO_ROOT_PASSWORD:-cogeto-dev-password}" &&
        mc mb --ignore-existing local/cogeto &&
        mc encrypt set sse-s3 local/cogeto &&
        case "$$(mc encrypt info local/cogeto)" in *sse-s3*)
        echo "bucket cogeto ready (SSE-S3 default encryption verified)";; *)
        echo "FATAL: bucket encryption could not be enabled/verified" >&2; exit 1;;
        esac &&
        printf '%s' '{"Version":"2012-10-17","Statement":[
        {"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],
        "Resource":["arn:aws:s3:::cogeto/*"]},
        {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:GetEncryptionConfiguration"],
        "Resource":["arn:aws:s3:::cogeto"]}]}' > /tmp/cogeto-app-policy.json &&
        mc admin policy create local cogeto-app-rw /tmp/cogeto-app-policy.json &&
        mc admin user add local "$$COGETO_S3_ACCESS_KEY" "$$COGETO_S3_SECRET_KEY" &&
        { mc admin policy attach local cogeto-app-rw --user "$$COGETO_S3_ACCESS_KEY" 2>/dev/null || true; } &&
        case "$$(mc admin user info local "$$COGETO_S3_ACCESS_KEY")" in *cogeto-app-rw*) : ;; *)
        echo "FATAL: cogeto-app-rw policy is not attached to the scoped user" >&2; exit 1;;
        esac &&
        mc alias set scoped http://minio:9000 "$$COGETO_S3_ACCESS_KEY" "$$COGETO_S3_SECRET_KEY" &&
        mc ls scoped/cogeto >/dev/null &&
        if mc admin info scoped >/dev/null 2>&1; then
        echo "FATAL: the scoped app credential can reach the MinIO admin API" >&2; exit 1;
        else echo "scoped app credential ready (object access verified, admin API refused)"; fi
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  # The zitadel image runs as uid 1000; the fresh named volume it writes its
  # bootstrap PAT into is root-owned. Hand it over before zitadel starts.
  machinekey-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    # busybox:stable (pinned by digest —)
    image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    command: ['chown', '-R', '1000:1000', '/machinekey']
    volumes:
      - zitadel-machinekey:/machinekey
    restart: 'no'

  zitadel-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # node:22-alpine (pinned by digest —)
    image: node@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
    command: ['node', '/init/init.mjs']
    environment:
      ZITADEL_INTERNAL_URL: http://zitadel:8080
      ZITADEL_EXTERNAL_DOMAIN: ${COGETO_EXTERNAL_DOMAIN:-localhost}
      COGETO_ISSUER: https://${COGETO_EXTERNAL_DOMAIN:-localhost}
      COGETO_REDIRECT_URI: https://${COGETO_EXTERNAL_DOMAIN:-localhost}/callback
      COGETO_POST_LOGOUT_URI: https://${COGETO_EXTERNAL_DOMAIN:-localhost}/
      ZITADEL_PAT_FILE: /machinekey/pat.txt
      COGETO_WEB_CONFIG_FILE: /web-config/config.json
      #: grant the FirstInstance admin the operator role so the System view
      # works out of the box (must match the app's COGETO_ADMIN_ROLE).
      ZITADEL_ADMIN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-admin@cogeto.localhost}
      COGETO_ADMIN_ROLE: ${COGETO_ADMIN_ROLE:-admin}
      # SEC-16: after provisioning succeeds the init REVOKES the bootstrap PAT
      # and blanks pat.txt — unless the sandbox needs it: the demo seed
      # provisions the demo Principal with this PAT, so demo mode (or an active
      # demo profile) keeps it, which is acceptable only because a sandbox
      # holds no real data. Both signals are passed because CLI --profile
      # flags are invisible to the container (same caveat as P6.7).
      COGETO_DEMO_MODE: ${COGETO_DEMO_MODE:-}
      COGETO_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    volumes:
      - ./project/infra/docker/zitadel-init:/init:ro
      # Writable (was :ro): the init revokes the PAT, blanks pat.txt and
      # records the provisioned state in bootstrap-state.json (SEC-16).
      - zitadel-machinekey:/machinekey
      - web-config:/web-config
    depends_on:
      zitadel:
        condition: service_healthy
    restart: 'no'

  # ── Infrastructure ──────────────────────────────────────────────────────────
  # All infra images are PINNED BY DIGEST; the tag is kept in a comment.
  postgres:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    # postgres:17-alpine
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: cogeto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cogeto-dev-password}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cogeto']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  qdrant:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    # qdrant/qdrant:v1.18.3
    image: qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    # API key auth. Qdrant enables auth whenever QDRANT__SERVICE__API_KEY
    # is present — INCLUDING an empty value — so it is opt-in (compose cannot
    # conditionally omit an env var, and an empty key would lock out the internal
    # clients). To require a key: set COGETO_QDRANT_API_KEY (the app/worker
    # clients send it automatically) AND uncomment the line below with the same
    # value. MUST be enabled before the qdrant.localhost console is exposed.
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${COGETO_QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    # minio/minio:RELEASE.2025-09-07T16-13-09Z
    # (SEC-35: was `latest`, which names no release. Resolved from the pinned
    # digest with `docker run --rm --entrypoint sh <digest> -c 'minio --version'`.
    # The digest is unchanged: this is a label, not a bump.)
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    # Console on :9001 (S3 API stays on :9000). Fronted by the localhost-only
    # `caddy-consoles` service under the `consoles` profile — no host
    # ports published here (single-ingress).
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cogeto}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cogeto-dev-password}
      # The console's public origin behind the Caddy edge.
      # NOTE: we deliberately do NOT set MINIO_SERVER_URL — it would point the
      # console's API client at https://s3.localhost, which is unresolvable from
      # inside the container (that DNS is host-only) and breaks console login
      # with a 503. Presigned downloads do NOT need it: MinIO validates SigV4
      # against the incoming Host header (preserved by Caddy), which matches
      # COGETO_S3_PUBLIC_URL. TLS is terminated at Caddy; MinIO speaks HTTP.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://minio.localhost}
      # Server-side encryption at rest: single-node KMS
      # backed by one named static key. Format: <name>:<base64 32 bytes>.
      # The baked-in value is DEV-ONLY; provisioning generates a real one per
      # instance (see .env.example). Rotation via KES is a Later item (0008).
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-cogeto-dev-key:bxaADytwX4au7d/HYGegSGd0uloQlb30uz6Vh5opUvg=}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  zitadel:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    # ghcr.io/zitadel/zitadel:v2.65.1 (pinned by digest —)
    image: ghcr.io/zitadel/zitadel@sha256:013d23b69aa681f03d36a7fd61e4837a7b049a7e22bd7215eb3e98e9dbf5543c
    #: masterkey via env (--masterkeyFromEnv reads ZITADEL_MASTERKEY below),
    # not on the command line — it is no longer visible in `docker inspect` / `ps`.
    command: 'start-from-init --masterkeyFromEnv --tlsMode external'
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel-dev-password}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      # SEC-1: Zitadel's bootstrap/migration admin is its own non-superuser
      # role (CREATEDB/CREATEROLE, provisioned by db-init) — no longer the
      # cluster superuser, and a credential the app never holds.
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel_admin
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_ADMIN_PASSWORD:-zitadel-dev-admin-password}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: ${COGETO_EXTERNAL_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: 'true'
      # TLS terminates at Caddy; this also keeps the `zitadel ready` probe on HTTP.
      ZITADEL_TLS_ENABLED: 'false'
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-Cogeto}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-admin@cogeto.localhost}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-DevPassword1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: 'false'
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Cogeto
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_USERNAME:-admin@cogeto.localhost}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: 'true'
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: cogeto-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Cogeto Bootstrap
      # SEC-16: the bootstrap PAT is revoked by zitadel-init the moment
      # provisioning succeeds (except in demo mode, which needs it to seed).
      # The expiry is therefore a backstop, not the control; the dev default
      # stays far-future so a fresh clone never breaks on a stale static date,
      # and the operator script generates a short one per install.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_BOOTSTRAP_PAT_EXPIRY:-2030-01-01T00:00:00Z}
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
      # Instance-default branding: no "Powered by Zitadel" watermark on the login UI.
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_DISABLEWATERMARK: 'true'
    volumes:
      - zitadel-machinekey:/machinekey
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      # SEC-1: the zitadel_admin role must exist before Zitadel's own init.
      db-init:
        condition: service_completed_successfully
      machinekey-init:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Infrastructure consoles edge (profile `consoles`) ─────────────────
  # The MinIO console, Qdrant dashboard, and the S3 presign origin — served ONLY
  # here, bound to 127.0.0.1, so they never answer on the public 80/443 listener
  # by Host header. Bring up with `--profile consoles`; reach them at
  # https://s3.localhost:8443 / https://minio.localhost:8443 /
  # https://qdrant.localhost:8443 (add the *.localhost DNS entries, decision
  # 0017). O1 presigned downloads resolve here too, so downloads need this
  # profile up and COGETO_S3_PUBLIC_URL pointing at the :8443 origin.
  caddy-consoles:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    profiles: ['consoles']
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: caddy-consoles
    ports:
      - '127.0.0.1:8443:443'
      - '127.0.0.1:8480:80'
    volumes:
      - caddy-consoles-data:/data
      - caddy-consoles-config:/config
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # ── Dev-only tools (profile-gated; never started by default) ───────────────
  # Seeds one MinIO object + file_metadata + derived memory so the deletion
  # saga's object leg is demonstrable before file upload exists.
  # Runs from the BUILD stage image — the runtime image excludes dev scripts.
  #   docker compose --profile dev-seed run --rm seed-object --owner <id> --org <id>
  seed-object:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    profiles: ['dev-seed']
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: build
    entrypoint: ['node', 'project/src/dist/entrypoints/seed-object.js']
    environment: *cogeto-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: 'no'

  # Plants a stray Qdrant point a confirmed receipt promised gone — the sweep
  # drill: run this, then the sweep, and watch System go red.
  #   docker compose --profile dev-seed run --rm seed-orphan
  seed-orphan:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    profiles: ['dev-seed']
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: build
    entrypoint: ['node', 'project/src/dist/entrypoints/seed-orphan.js']
    environment: *cogeto-env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: 'no'

  # ── Ana sandbox (profile demo) ────────────────────────
  #
  # ⚠️ SECURITY WARNING. This profile turns the instance
  #     into the PUBLIC SANDBOX: the demo-seed job provisions a real Zitadel
  #     Principal and publishes its access token on the (public) /api/config, so
  #     any visitor is pre-authenticated. This is acceptable ONLY because the
  #     instance holds NO REAL DATA and is disposable. The demo profile must
  #     NEVER share infrastructure (Postgres / Qdrant / MinIO / Zitadel) with a
  #     customer instance — a leaked demo token must reach nothing but fictional
  #     data. A production instance (COGETO_PRODUCTION=1) refuses the demo seed.
  #
  #   COGETO_DEMO_MODE=1 docker compose --profile demo up --build
  # seeds the sandbox, serves the demo session (: the flag is REQUIRED),
  #     and enables the worker's scheduled reset.
  #
  # SEC-16 note: the demo seed needs the bootstrap PAT, so demo mode must be
  # on from the FIRST boot of a fresh stack. A stack that already booted
  # non-demo has revoked and blanked the PAT — enabling demo afterwards needs
  # `docker compose down -v` first (dev data is disposable by definition).
  #
  # Runs from the BUILD image (like seed-object) — it needs the demo corpus and
  # dev entrypoints the runtime image strips. Feeds the corpus through the REAL
  # public API (no direct DB inserts) and asserts the end state.
  demo-seed:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    profiles: ['demo']
    build:
      context: .
      dockerfile: project/infra/docker/Dockerfile
      target: build
    entrypoint: ['node', 'project/src/dist/entrypoints/demo-seed.js']
    environment:
      <<: *cogeto-env
      COGETO_DEMO_MODE: '1'
      COGETO_DEMO_APP_URL: http://app:3000
      COGETO_ZITADEL_PAT_FILE: /machinekey/pat.txt
    volumes:
      # Bootstrap PAT to provision the demo Principal; demo-config to publish its
      # session for the app + worker.
      - zitadel-machinekey:/machinekey:ro
      - demo-config:/demo-config
    depends_on:
      app:
        condition: service_healthy
      zitadel:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully
    restart: 'no'

  # ── Redaction sidecar (profile redaction; spec §12.2,/0023) ────────
  #
  # Local CPU NER (Presidio) that pseudonymizes sensitive entities before any
  # external model call and re-identifies the response — "PII never leaves your
  # box, even though a frontier model answers you." Python ONLY here, isolated
  # behind the model-gateway seam. Stateless: no DB, no volumes.
  # Internal-network only (no published ports); reachable at http://redaction:8080.
  #
  #   REDACTION_ENABLED=1 docker compose --profile redaction up --build
  #
  # The env flips the gateway on; the profile brings the sidecar up. If enabled
  # and the sidecar is unreachable, model calls FAIL CLOSED (never plaintext).
  # Memory: ~0.7–1 GB RSS (spaCy en_core_web_lg). See project/services/redaction.
  redaction:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    profiles: ['redaction']
    build:
      context: project/services/redaction
    environment:
      SPACY_MODEL: ${REDACTION_SPACY_MODEL:-en_core_web_lg}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  # ── Web discovery (profile research; Priority 5 Part A) ──────
  #
  # Self-hosted SearXNG: discovery queries public engines FROM THIS INSTANCE —
  # no API key, no vendor, no query logging (metrics disabled, WARNING log
  # level; see project/infra/docker/searxng/settings.yml for the curated engine
  # set and how to adjust it). Internal-network only (no published ports);
  # reachable at http://searxng:8080. Memory: roughly 100–200 MB RSS.
  #
  #   docker compose --profile research up
  #
  # The app profile-independently reads COGETO_SEARXNG_URL; with the profile
  # down, research search answers a typed "search unavailable" — nothing breaks.
  searxng:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    profiles: ['research']
    image: searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-cogeto-dev-searxng-secret}
    volumes:
      - ./project/infra/docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ── Inbound mail (roadmap D2) ────────────────────
  #
  # Per-tenant, RECEIVE-ONLY Haraka SMTP. Accepts forwarded mail for this
  # instance's single inbound address, applies recipient/size/rate hygiene, and
  # POSTs the full raw message to the app's internal authenticated intake
  # (COGETO_MAIL_INTAKE_TOKEN must match the app). It NEVER sends. Listens on
  # 2525 as a non-root user; the standard inbound port 25 is mapped to it. The
  # allowlist (the real acceptance gate) lives in the app, not here.
  #
  # MX/TLS/DNS to point real mail at this container is an O6 provisioning
  # concern; see docs/operations/email-inbound.md. Locally, exercise it with
  # scripts/dev/send-test-email.mjs (no real DNS needed).
  mail:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # SEC-14: OFF by default. Inbound SMTP used to be published on 0.0.0.0:25 on
    # every instance, so a deployment that never uses email capture still ran an
    # internet-facing Haraka listener parsing hostile SMTP, with no supported way
    # to turn it off. It is now an opt-in capability like `research` and
    # `redaction`:
    #
    #   COMPOSE_PROFILES=mail docker compose up          (dev)
    #   cogeto features enable mail                      (customer instance)
    #
    # With the profile down the app reports the `mail` capability as `off` and
    # its health check stays green — nothing degrades, email capture is simply
    # unavailable.
    profiles: ['mail']
    build:
      context: project/services/mail
    environment:
      COGETO_MAIL_INBOUND_ADDRESS: ${COGETO_MAIL_INBOUND_ADDRESS:-capture@in.localhost}
      COGETO_MAIL_MAX_BYTES: ${COGETO_MAIL_MAX_BYTES:-26214400}
      COGETO_INTAKE_URL: ${COGETO_INTAKE_URL:-http://app:3000/api/email/intake}
      COGETO_MAIL_INTAKE_TOKEN: ${COGETO_MAIL_INTAKE_TOKEN:-cogeto-dev-mail-token}
      # Inbound STARTTLS (GAP-2): the entrypoint enables STARTTLS only when a
      # readable cert/key is present at these paths. Dev leaves them unmounted →
      # STARTTLS is simply not advertised; a deployed instance populates them.
      COGETO_MAIL_TLS_CERT: ${COGETO_MAIL_TLS_CERT:-/app/tls/cert.pem}
      COGETO_MAIL_TLS_KEY: ${COGETO_MAIL_TLS_KEY:-/app/tls/key.pem}
    ports:
      # Host inbound port 25 → container 2525 (non-root listener). Change the
      # host side if 25 is taken locally, e.g. '2525:2525'.
      - '${COGETO_MAIL_HOST_PORT:-25}:2525'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(2525,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  qdrant-data:
  minio-data:
  instance-keys:
  #: the public-key-only volume the internet-facing app mounts (migrate
  # publishes the public half here; the private half never leaves instance-keys).
  instance-pubkey:
  zitadel-machinekey:
  web-config:
  caddy-data:
  caddy-config:
  caddy-consoles-data:
  caddy-consoles-config:
  # Ana sandbox demo Principal's session — written by demo-seed,
  # read by app + worker. Empty (inert) on a non-demo instance.
  demo-config:
