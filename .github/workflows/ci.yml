# Continuous integration for Cogeto.
#
# Runs on every pull request and on push to main. Five jobs are the REQUIRED
# status checks for branch protection on main:
#
#     lint · boundaries · test · build · eval-gate
#
# Two further jobs are NOT required to merge: `scan` (dependency + image
# vulnerability scanning, audit 2.0 SEC-19) and `docker-build`, which keeps every
# production Dockerfile green on each PR (amd64, no push). Promoting `scan` to a
# required check is a branch-protection change in the repository settings.
#
# "install" is per-job: each job checks out, restores the shared npm download
# cache via setup-node (cache: npm), and runs `npm ci`. Sharing a single
# node_modules across jobs would mean uploading/downloading it as an artifact
# on every run — slower and more fragile than a cached `npm ci`, which is the
# GitHub-recommended pattern.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the previous run on that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      # Host-level scripting is linted too: the operator script (session O6)
      # must stay shellcheck-clean. ubuntu-latest ships shellcheck.
      - name: Shellcheck (operator script)
        run: shellcheck scripts/operator/cogeto

  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Module boundaries (dependency-cruiser, spec §15)
        run: npm run boundaries

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The shared package resolves via its compiled entrypoint (dist/index.js),
      # so build it before Vitest runs the source specs that import it.
      # Integration suites start real containers via Testcontainers; the
      # ubuntu-latest runner ships a working Docker engine.
      - name: Build shared (for @cogeto/shared resolution)
        run: npm run build -w @cogeto/shared
      - name: Test (Vitest + Testcontainers)
        run: npm run test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (shared → server → web)
        run: npm run build

  # ── eval-gate (spec §14) ─────────────────────────────────────────
  # Prompt, model, or pipeline changes that regress the golden set fail the
  # build. Secret-gated behaviour is preserved:
  #
  #   • Pull requests (including from forks): the CACHED path — both suites run
  #     against committed fixtures recorded from a live run
  #     (project/eval/cache/, V2.0 item 3.4). No secret is read, so fork PRs run
  #     cleanly and the API key never touches a PR branch. This job always
  #     concludes, which is required for it to be a required status check.
  #     A cached run catches prompt, pipeline and scoring regressions. It does
  #     NOT catch model-side drift, and it is never published as a trust score:
  #     the harness refuses --emit-json in replay mode.
  #   • Push to main (post-merge): the LIVE golden-set gate runs with the key.
  #     It remains the authority for the published numbers. If the secret is
  #     somehow absent it SKIPS LOUDLY (a warning annotation) rather than
  #     failing silently.
  #
  # Thresholds live in project/eval/gates.json (ratchet UP only; lowering a gate
  # needs a decision record).
  eval-gate:
    name: eval-gate
    runs-on: ubuntu-latest
    # The LIVE gate (push to main) shares one Mistral API key with the release
    # pipeline's trust-scores job. Tagging right after a merge ran both at
    # once and they 429-rate-limited each other (v0.9.2). Serialize every
    # live-key consumer through one repo-wide concurrency group; PR runs are
    # mocked (no key) and keep their own per-ref group.
    concurrency:
      group: ${{ github.event_name == 'push' && 'live-model-eval' || format('eval-gate-pr-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the path filter below diffs the pushed range.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci

      # ── PR cached path (V2.0 item 3.4) ───────────────────────────────────
      # Both suites, gated, against the committed fixtures. A case with no
      # recorded response FAILS naming the refresh command: a partial run
      # reported as green is the false green this exists to prevent.
      #
      # The chat suite starts real containers via Testcontainers; the
      # ubuntu-latest runner ships a working Docker engine.
      - name: Cached eval gate (pull requests, no secrets)
        if: github.event_name == 'pull_request'
        env:
          COGETO_EVAL_CACHE: replay
          COGETO_EVAL_GATE: '1'
        run: |
          echo "::notice title=cached eval::Extraction, verification, reconciliation and query-rewrite run against committed fixtures (project/eval/cache). This catches prompt, pipeline and scoring regressions. It does NOT catch model-side drift, and it never publishes a trust score: the LIVE post-merge gate remains the authority for the published numbers."
          echo "::notice title=chat suite NOT cached::The chat suite runs LIVE post-merge only. Its answer prompt embeds the retrieved facts in retrieval order, and equally scored facts come back in a different order on every run, so the same model responses produce a different prompt and the cache can never hit. docs/eval-golden-set.md §6 records the evidence and the fix that unblocks it."
          npm run build -w @cogeto/shared -w @cogeto/server
          node project/src/dist/entrypoints/eval.js

      # The frontend build is not covered by the harness above and used to be
      # this job's only PR work; the `build` check owns it, and it stays here so
      # a broken web build still fails eval-gate fast.
      - name: Build (pull requests)
        if: github.event_name == 'pull_request'
        run: npm run build

      # ── Path filter: the live gates run only when the push
      # touches something that can change answer/memory quality — prompts, the
      # model gateway, ingestion, retrieval, or the eval corpus/harness. A
      # dependency bump or docs change skips LOUDLY instead of spending live
      # model calls on a question the diff cannot have changed.
      - name: Quality-relevant paths changed? (push only)
        id: paths
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"   # first push / force-push: run
            echo "::notice::base commit unavailable — running the live gates"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" \
              | grep -qE '^(project/prompts/|project/eval/|project/src/(model-gateway|ingestion|retrieval|memory)/|project/src/entrypoints/eval)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=live eval SKIPPED::No quality-relevant paths in this push (prompts, model-gateway, ingestion, retrieval, memory, eval corpus/harness) — the live golden-set + chat gates did not run."
          fi

      - name: Check for the eval secret (push to main only)
        id: secret
        if: github.event_name == 'push' && steps.paths.outputs.relevant == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=eval gate SKIPPED::MISTRAL_API_KEY is not available on main. The golden-set gate did NOT run — add the repository secret."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Golden-set gate (extraction + reconciliation, gates.json)
        if: github.event_name == 'push' && steps.paths.outputs.relevant == 'true' && steps.secret.outputs.present == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COGETO_EVAL_GATE: '1'
        run: npm run eval

      - name: Chat eval gate (rule checks + mean coverage)
        if: github.event_name == 'push' && steps.paths.outputs.relevant == 'true' && steps.secret.outputs.present == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COGETO_EVAL_GATE: '1'
        run: npm run eval:chat

  # ── scan (not required to merge — see the note below) ───────────────────────
  # Dependency vulnerability scanning (audit 2.0 SEC-19). CI had none: a
  # vulnerable dependency could reach main and be released with nothing failing.
  #
  # Every gate below was run locally on 2026-07-30 before being wired in, so
  # this job is green on day one rather than red-walling every open PR:
  #
  #   • root prod tree      npm audit --omit=dev --audit-level=high  → 0 findings
  #   • mail prod tree      npm audit --omit=dev --audit-level=high  → 0 findings
  #     (its `tar` advisory is MODERATE and the service never reads a tar
  #     archive, so `high` is the honest threshold, not a lowered one)
  #   • redaction lock      pip-audit                                → 1 finding, allowlisted below
  #   • runtime image       trivy CRITICAL,HIGH                      → 6 findings, ALL in the
  #     npm CLI bundled inside node:22-alpine, none in application dependencies
  #
  # `--omit=dev` is deliberate and is NOT a weakened threshold: the dev tree
  # carries 10 known highs (testcontainers → archiver → minimatch, and ajv →
  # fast-uri) that are never installed into any shipped image.
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Production dependencies only — what actually ships.
      - name: npm audit (application, production tree)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (inbound mail service, production tree)
        working-directory: project/services/mail
        run: npm audit --omit=dev --audit-level=high

      # 3.12 to match the sidecar's base image: the lock is compiled for that
      # runtime, and resolving it on another Python pulls version-conditional
      # packages that are not hash-pinned (docs/operations/image-pins.md).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: pip-audit (redaction sidecar lock)
        working-directory: project/services/redaction
        # ALLOWLIST. Every entry below is the SAME finding in the same place:
        # `cryptography`, pinned at 46.0.7 in the hash-locked tree, reached only
        # as a transitive dependency of presidio-anonymizer. It is not declared
        # in requirements.txt, the sidecar imports no part of it, and the
        # advisories are all in TLS and X.509 code paths the service never
        # enters: it is stateless, internal-network-only (no published ports),
        # speaks plain HTTP behind the model-gateway seam, terminates no TLS and
        # parses no certificates.
        #
        # WHY NOT JUST BUMP IT: the ceiling is upstream, not ours.
        # presidio-anonymizer 2.2.363 requires cryptography <47.0.0, and even
        # its newest release, 2.2.364, only widens that to <49.0.0. The fixes
        # below land in 49.0.0 and 50.0.0, so NO available presidio release
        # permits a cryptography that resolves them. Revisit when presidio
        # widens the constraint; that is the trigger, not a calendar date, and
        # it is also when the lock should be regenerated.
        #
        #   reviewed 2026-07-30
        #   GHSA-537c-gmf6-5ccf  high    (fix: 48.0.1)
        #     Vulnerable OpenSSL included in the cryptography wheels.
        #
        #   reviewed 2026-08-04, published upstream 2026-08-03 21:17 to 21:27
        #   UTC, which is why this job went from green to red with no commit in
        #   between:
        #   GHSA-g6cj-pr64-35w5  high    CVE-2026-69247  (fix: 50.0.0)
        #     PKCS#7 EnvelopedData decryption exposes a Bleichenbacher oracle
        #     through distinguishable errors and timing. The sidecar decrypts no
        #     PKCS#7.
        #   GHSA-jwv3-5hgf-82ww  high    CVE-2026-69249  (fix: 49.0.0)
        #     Duplicate self-signed intermediates cause exponential path
        #     building. The sidecar builds no certificate chains.
        #   GHSA-m2h6-j472-rp4c  medium  CVE-2026-69248  (fix: 49.0.0)
        #     The verifier accepts wildcard DNS names, allowing escape from
        #     permittedSubtrees name constraints. The sidecar verifies no
        #     certificates.
        run: |
          pip install --quiet pip-audit
          pip-audit -r requirements.lock --no-deps \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln GHSA-g6cj-pr64-35w5 \
            --ignore-vuln GHSA-jwv3-5hgf-82ww \
            --ignore-vuln GHSA-m2h6-j472-rp4c

      # The built image, not just the manifests: catches anything the base image
      # drags in. Fails on CRITICAL/HIGH in application dependencies and OS
      # packages.
      # Required for `load: true` together with the GitHub Actions cache: the
      # default `docker` driver cannot export a cache backend, so buildx has to
      # be set up explicitly (docker-container driver).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the runtime image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: project/infra/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: cogeto/cogeto:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cogeto/cogeto:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
          # SCOPED EXCLUSION — reviewed 2026-07-30. This is the npm CLI that
          # node:22-alpine bundles, not anything we install or execute: the
          # containers run `node project/src/dist/entrypoints/<entrypoint>.js`
          # and never invoke npm. On 2026-07-30 it carried CVE-2026-59873 (tar,
          # CRITICAL), CVE-2026-59874 (tar), CVE-2026-13149 + CVE-2026-14257
          # (brace-expansion), CVE-2026-33671 (picomatch) and CVE-2026-48815
          # (sigstore) — all denial-of-service or verification issues in code
          # that never runs here, and none fixable without an upstream base
          # image release. Excluded by PATH rather than by CVE id so the
          # exclusion stays honest as that set changes; everything we actually
          # install remains fully gated.
          skip-dirs: 'usr/local/lib/node_modules/npm'

  # ── docker-build (not required to merge) ────────────────────────────────────
  # Builds the production amd64 images WITHOUT pushing, so the Dockerfiles stay
  # green on every PR. Docker layers are cached via the GitHub Actions cache.
  # All three pull-only images a customer instance needs are covered (decision
  # 0030): runtime (cogeto/cogeto), the Caddy edge (cogeto/cogeto-edge), and
  # the Haraka mail service (cogeto/cogeto-mail).
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build amd64 runtime image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: project/infra/docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 edge image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: project/infra/docker/Dockerfile
          target: caddy
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 mail image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: project/services/mail
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # SEC-19: the redaction sidecar was never built in CI, so a broken
      # Dockerfile or an unresolvable hash-locked wheel only surfaced when an
      # operator brought the profile up. It is not a released image (the
      # redaction profile is not part of the deploy channel), but it must stay
      # buildable.
      - name: Build amd64 redaction sidecar image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: project/services/redaction
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
