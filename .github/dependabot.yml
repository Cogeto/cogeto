# Dependabot configuration (PA-5). Version-update PRs on a weekly cadence for
# every ecosystem in the repo; GitHub-native Dependabot SECURITY updates are
# enabled separately in Settings → Code security (owner action). All PRs are
# labelled so they group correctly in the release notes (.github/release.yml)
# and land through the normal required-checks + squash-merge loop.
version: 2
updates:
  # GitHub Actions — keep the SHA-pinned actions (PA-6) current. Dependabot
  # bumps the pinned SHA and refreshes the trailing `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
      - dependencies
    groups:
      actions:
        patterns:
          - '*'

  # npm workspace (root lockfile covers @cogeto/shared, @cogeto/server, web).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - chore
      - dependencies
    groups:
      # One PR for routine dev/test tooling; production deps stay individual so
      # each is reviewed against the module boundaries + eval gate on its own.
      # Minor+patch ONLY: majors arrive as individual PRs so one incompatible
      # major (e.g. a TypeScript bump ahead of typescript-eslint's peer range)
      # cannot poison the whole group (2026-07 triage, PR #109).
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint's peer range caps the TypeScript major; take TS
      # majors deliberately once the toolchain supports them.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Version-locked to the digest-pinned Qdrant server image (client
      # major.minor tracks the server - docs/operations/image-pins.md).
      # Upgraded manually in lockstep with the server, never alone.
      - dependency-name: '@qdrant/js-client-rest'
      # Type stubs track the runtime Node major (24, engines + node:24-alpine
      # images); newer stubs would describe APIs the runtime does not have.
      # Bump together with a Node runtime move, never alone.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Receive-only Haraka mail service (its own package.json + lockfile — SEC-9).
  # It parses hostile internet input, so keep its tree current.
  - package-ecosystem: npm
    directory: /project/services/mail
    schedule:
      interval: weekly
    labels:
      - chore
      - dependencies

  # Python redaction sidecar (requirements.txt → hash-locked requirements.lock).
  - package-ecosystem: pip
    directory: /project/services/redaction
    schedule:
      interval: weekly
    labels:
      - chore
      - dependencies

  # ── Container images (audit 2.0 SEC-5) ──────────────────────────────────────
  # Every base image and every compose service image is pinned BY DIGEST, which
  # makes builds reproducible but also means a pin never moves on its own: the
  # Zitadel pin sat on v2.65.1 (Nov 2024) with no mechanism to notice.
  #
  # Shaped by the 2026-08 triage. Multi-directory entries: a per-directory
  # split meant a node bump arrived as four PRs that could never pass the
  # dev/deploy digest-parity test individually. A `groups` block on each
  # entry: without one, `directories` still opens one PR per directory. The
  # pins carry their tag in the reference (`node:24-alpine@sha256:…`) so
  # Dependabot proposes new digests of the INTENDED tag, never of `latest`,
  # and the tag can never go stale beside its digest. Majors this project
  # takes deliberately are ignored below so they stop resurfacing weekly:
  # Node (24 is the runtime until a planned move), Python (the redaction
  # hash lock is compiled for 3.12), Zitadel (EOL v2 must step through v3,
  # a planned migration), Qdrant (server and npm client move in lockstep,
  # manually).
  - package-ecosystem: docker
    directories:
      - /project/infra/docker
      - /project/services/mail
      - /project/services/redaction
    schedule:
      interval: weekly
    labels:
      - chore
      - dependencies
    groups:
      base-images:
        patterns:
          - '*'
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  # The dev compose contract at the repo root plus the pull-only customer
  # stack; the parity test requires their shared images to move together.
  # NOTE: a deploy-compose change still needs `deploy-assets.sha256`
  # regenerated (scripts/ci/deploy-assets-manifest.mjs --write) before merge,
  # which Dependabot cannot do; its compose PRs are taken over manually.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /project/infra/deploy
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns:
          - '*'
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: zitadel/zitadel
        update-types: ['version-update:semver-major']
      - dependency-name: qdrant/qdrant
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    labels:
      - chore
      - dependencies
