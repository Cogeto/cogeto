# Cogeto customer-instance stack — PULL-ONLY (roadmap D3).
#
# This is the compose file the operator script (scripts/operator/cogeto)
# installs at /srv/cogeto on a customer instance. It differs from the repo-root
# docker-compose.yml (the dev contract) in exactly these ways:
#
#   • NO `build:` keys anywhere — the instance pulls the prebuilt, cosign-signed
#     release images and never builds:
#       cogeto/cogeto:${COGETO_VERSION}           app / worker / migrate / preflight
#       cogeto/cogeto-edge:${COGETO_VERSION}      Caddy edge with the built SPA
#       cogeto/cogeto-mail:${COGETO_VERSION}      receive-only Haraka inbound SMTP
#       cogeto/cogeto-redaction:${COGETO_VERSION} local PII redaction sidecar
#   • Secrets are REQUIRED (`${VAR:?...}`) — a missing .env fails loudly instead
# of falling back to a DEV default (preflight, is the backstop).
#   • COGETO_PRODUCTION=1 is hardcoded — the demo seed/reset hard-refuse.
#   • The demo / dev-seed / consoles profiles are absent: they are dev-only and
#     their images are never published. THREE optional profiles are here:
#     `research` (SearXNG, a digest-pinned upstream image, so it deploys
#     pull-only like everything else), `mail` (audit 2.0 SEC-14 — inbound SMTP
#     is opt-in, so an instance that does not use email capture runs no
#     internet-facing listener) and `redaction` (issue #565 — the sidecar is a
#     published, signed release image since this change, so a pull-only
#     instance has something to pull; it used to be absent here, which made the
#     posture the security documentation described unreachable on the only
#     supported deployment path). Enable any with
#     `cogeto features enable <id>`, which maintains COMPOSE_PROFILES in .env,
#     mirrors it into COGETO_COMPOSE_PROFILES for the app, and (for mail) opens
#     25/tcp in ufw and prints the DNS/MX steps.
# • Qdrant API-key auth is always on.
#   • The edge terminates TLS with a real Let's Encrypt certificate: the
#     production Caddyfile (./Caddyfile) is mounted over the baked-in dev one.
#
# Infra images stay PINNED BY DIGEST, same digests as the dev stack;
# the human-readable tag is kept in the reference (docs/operations/image-pins.md).

name: cogeto

# ── Resource ceilings (security audit 2.0, SEC-17) ────────────────────────────
#
# No container had a memory, CPU or pid ceiling, so one runaway process could
# take the instance down with it: the redaction sidecar alone holds ~1 GB RSS,
# and a Qdrant index rebuild, a document-parsing burst or a 25 MB mail delivery
# could OOM-kill Postgres.
#
# Every service now carries `mem_limit` / `cpus` / `pids_limit`. These are
# CEILINGS, not reservations: nothing is set aside, so the stack still fits the
# 8 GB / 2 vCPU minimum the operator script enforces. They are sized from what
# each service actually uses with generous headroom, because a limit that kills
# a service under normal load is worse than no limit at all:
#
#   worker  3g  — the widest range: 25 MB document parses, embedding batches
#                 and Node's own heap growth. Deliberately the largest cap.
#   app     2g  — request handling plus SSE streams; steady state is far below.
#   postgres/qdrant 2g — room for a real corpus and an index rebuild.
#   redaction 2g — the documented ~0.7-1 GB spaCy model, doubled.
#   minio/zitadel 1g, searxng 1g, mail 512m, caddy 256m — measured steady state
#                 is a small fraction of each.
#   one-shot init jobs 128m-1g — they do one bounded thing and exit.
#
# `cpus` is 1.5 for the heavy services and 1.0 for the rest: on the 2 vCPU
# minimum that still leaves the scheduler room, and on a larger instance it
# stops one service from monopolising the box. `pids_limit` bounds fork bombs
# in anything that shells out.

services:
  # ── Edge (TLS via Let's Encrypt, HTTP→HTTPS redirect handled by Caddy) ──────
  caddy:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # The edge binds 80 and 443 INSIDE the container, which is exactly what
    # NET_BIND_SERVICE buys and the only capability it keeps. Not read-only:
    # Caddy writes its certificate store (/data), its autosave config
    # (/config) and its own scratch files, and an edge that cannot persist an
    # ACME account re-registers on every restart.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    image: cogeto/cogeto-edge:${COGETO_VERSION:?write COGETO_VERSION into .env (the operator script does this)}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      COGETO_EXTERNAL_DOMAIN: ${COGETO_EXTERNAL_DOMAIN:?}
      COGETO_ACME_EMAIL: ${COGETO_ACME_EMAIL:?}
      # Inbound-mail TLS (issue #566): `mail.<domain>` when email capture is
      # enabled. `cogeto features enable/disable mail` and `cogeto configure
      # --domain` maintain it from the SAME derivation the DNS checklist prints
      # (derive_mx_host).
      #
      # The fallback is an INERT SITE ADDRESS, not an empty string, and it is
      # substituted here rather than left to the Caddyfile because Caddy's
      # `{$VAR:default}` applies its default only when the variable is UNSET:
      # compose always sets it, so an empty value would reach Caddy as an empty
      # site address and crash-loop the edge. (Observed on the deploy stack, not
      # reasoned about.) The explicit `http://` scheme turns automatic HTTPS off
      # for that site and `.invalid` is reserved by RFC 2606, so an instance
      # without email capture orders nothing and serves what it served before.
      # It must stay identical to the Caddyfile's own defensive default.
      COGETO_MAIL_TLS_SITE: ${COGETO_MAIL_TLS_SITE:-http://mail-tls-disabled.invalid}
    volumes:
      # The production vhost (real domain + ACME) replaces the baked-in dev
      # Caddyfile (localhost + local_certs).
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      app:
        condition: service_healthy
      zitadel:
        condition: service_healthy
    restart: unless-stopped

  # ── Application processes (same image, different commands) ─────────────────
  app:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Node as uid 1000 (USER node in the image), binding 3000: it needs no
    # capability whatsoever. Read-only root, because everything it writes is
    # a mount and every mount it has is :ro — uploads are held in memory
    # (multer.memoryStorage) and go straight to MinIO. /tmp is a small tmpfs
    # so a temp file cannot outlive the container.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    image: cogeto/cogeto:${COGETO_VERSION:?}
    # --max-old-space-size tells V8 about the cgroup ceiling above. Without it
    # Node sizes its heap from the HOST's memory and grows past mem_limit, and
    # the kernel SIGKILLs the container instead of V8 collecting harder. Set
    # below the limit, not at it: off-heap allocation (Buffers, the raw bytes of
    # an upload or a mail body) counts against the container but never against
    # the heap budget, so the gap is the off-heap working room.
    command: ['node', '--max-old-space-size=1536', 'project/src/dist/entrypoints/app.js']
    environment: &cogeto-env
      COGETO_MIGRATIONS_DIR: ${COGETO_MIGRATIONS_DIR:-}
      COGETO_PROMPTS_DIR: ${COGETO_PROMPTS_DIR:-}
      # Operator limits and knobs (issue #516): every COGETO_* that entrypoints
      # reads and .env.example documents is passed through (demo-profile
      # variables deliberately excluded: a customer stack must not grow a
      # demo switch). Blank resolves to the code default. Enforced by
      # entrypoints/env-consistency.spec.ts.
      COGETO_CONSOLES_ENABLED: ${COGETO_CONSOLES_ENABLED:-}
      COGETO_DAILY_CAPTURE_MAX: ${COGETO_DAILY_CAPTURE_MAX:-}
      COGETO_DOWNLOAD_URL_TTL_SECONDS: ${COGETO_DOWNLOAD_URL_TTL_SECONDS:-}
      COGETO_ENV: ${COGETO_ENV:-}
      COGETO_EXTRACT_MAX_FACTS: ${COGETO_EXTRACT_MAX_FACTS:-}
      COGETO_MAIL_INTAKE_MAX_PER_SENDER: ${COGETO_MAIL_INTAKE_MAX_PER_SENDER:-}
      COGETO_MAIL_INTAKE_RATE_WINDOW_SECONDS: ${COGETO_MAIL_INTAKE_RATE_WINDOW_SECONDS:-}
      COGETO_MAIL_REQUIRE_SPF: ${COGETO_MAIL_REQUIRE_SPF:-}
      COGETO_MODEL_DAILY_CALLS: ${COGETO_MODEL_DAILY_CALLS:-}
      COGETO_MODEL_DAILY_TOKENS: ${COGETO_MODEL_DAILY_TOKENS:-}
      COGETO_PARSE_CSV_FALLBACK_ENCODING: ${COGETO_PARSE_CSV_FALLBACK_ENCODING:-}
      COGETO_PARSE_MAX_CHUNKS: ${COGETO_PARSE_MAX_CHUNKS:-}
      COGETO_PARSE_MAX_FILE_ROWS: ${COGETO_PARSE_MAX_FILE_ROWS:-}
      COGETO_PARSE_MAX_SHEET_ROWS: ${COGETO_PARSE_MAX_SHEET_ROWS:-}
      COGETO_PARSE_MAX_TEXT_CHARS: ${COGETO_PARSE_MAX_TEXT_CHARS:-}
      COGETO_PARSE_TIMEOUT_SECONDS: ${COGETO_PARSE_TIMEOUT_SECONDS:-}
      COGETO_PG_POOL_MAX: ${COGETO_PG_POOL_MAX:-}
      COGETO_RATELIMIT_CAPTURE: ${COGETO_RATELIMIT_CAPTURE:-}
      COGETO_RATELIMIT_CHAT: ${COGETO_RATELIMIT_CHAT:-}
      COGETO_RATELIMIT_REMEMBER: ${COGETO_RATELIMIT_REMEMBER:-}
      COGETO_RATELIMIT_UPLOAD: ${COGETO_RATELIMIT_UPLOAD:-}
      COGETO_RATELIMIT_WINDOW_SECONDS: ${COGETO_RATELIMIT_WINDOW_SECONDS:-}
      COGETO_REASONING_PROBE_TIMEOUT_MS: ${COGETO_REASONING_PROBE_TIMEOUT_MS:-}
      COGETO_REPORT_BRAND_DIR: ${COGETO_REPORT_BRAND_DIR:-}
      COGETO_REPORT_FONTS_DIR: ${COGETO_REPORT_FONTS_DIR:-}
      COGETO_RESEARCH_ENABLED: ${COGETO_RESEARCH_ENABLED:-}
      COGETO_SKILL_MAX_QUERIES: ${COGETO_SKILL_MAX_QUERIES:-}
      COGETO_SKILL_PAGES_PER_QUERY: ${COGETO_SKILL_PAGES_PER_QUERY:-}
      COGETO_SSE_IDLE_TIMEOUT_SECONDS: ${COGETO_SSE_IDLE_TIMEOUT_SECONDS:-}
      COGETO_SSE_MAX_CONCURRENT: ${COGETO_SSE_MAX_CONCURRENT:-}
      COGETO_SSE_MAX_DURATION_SECONDS: ${COGETO_SSE_MAX_DURATION_SECONDS:-}
      COGETO_TRUST_SCORES_DIR: ${COGETO_TRUST_SCORES_DIR:-}
      COGETO_UPLOAD_MAX_BYTES: ${COGETO_UPLOAD_MAX_BYTES:-}
      COGETO_VISION_PAGES_PER_DOCUMENT: ${COGETO_VISION_PAGES_PER_DOCUMENT:-}
      COGETO_VISION_PAGES_PER_USER_DAILY: ${COGETO_VISION_PAGES_PER_USER_DAILY:-}
      COGETO_VISION_PROBE_TIMEOUT_MS: ${COGETO_VISION_PROBE_TIMEOUT_MS:-}
      COGETO_HTTP_PORT: 3000
      # SEC-1: the runtime connects as the least-privilege cogeto_app role
      # (DML only, no DDL, no TRIGGER privilege, no access to the zitadel
      # database), provisioned by the db-init one-shot below. The superuser
      # credential is never handed to a long-running service.
      COGETO_DATABASE_URL: postgres://cogeto_app:${COGETO_APP_DB_PASSWORD:?}@postgres:5432/cogeto
      COGETO_QDRANT_URL: http://qdrant:6333
      COGETO_QDRANT_API_KEY: ${COGETO_QDRANT_API_KEY:?}
      COGETO_S3_URL: http://minio:9000
      # Browser-reachable S3 origin for presigned download URLs: the
      # s3.<domain> vhost on the edge, proxied to MinIO with the Host header
      # preserved so the SigV4 check matches.
      COGETO_S3_PUBLIC_URL: ${COGETO_S3_PUBLIC_URL:-https://s3.${COGETO_EXTERNAL_DOMAIN}}
      # SEC-2: the SCOPED application credential provisioned by minio-init
      # (put, get, delete, list, encryption-read on the cogeto bucket only) —
      # never the MinIO root credential.
      COGETO_S3_ACCESS_KEY: ${COGETO_S3_ACCESS_KEY:-cogeto-app}
      COGETO_S3_SECRET_KEY: ${COGETO_S3_SECRET_KEY:?}
      COGETO_S3_BUCKET: cogeto
      # Instance signing keypair (deletion receipts, spec §11.1) — generated by the
      # migrate init job on first boot INSIDE the instance-keys volume.:
      # the internet-facing app mounts ONLY the public half.
      COGETO_INSTANCE_KEY_DIR: /instance-keys
      COGETO_ASSERT_NO_PRIVATE_KEY: '1'
      COGETO_OIDC_ISSUER: https://${COGETO_EXTERNAL_DOMAIN:?}
      COGETO_OIDC_INTERNAL_URL: http://zitadel:8080
      COGETO_OIDC_EXTERNAL_DOMAIN: ${COGETO_EXTERNAL_DOMAIN}
      COGETO_WEB_CONFIG_FILE: /web-config/config.json
      # The instance master key (V2.4 item 7.1): what encrypts the provider keys
      # stored in the database. It stays in the environment on purpose, because
      # a key that guards a database cannot live inside it. `:-` and not `:?`
      # because an instance whose only endpoint needs no credential never needs
      # one; the moment a key must be stored, the failure names this variable.
      COGETO_MASTER_KEY: ${COGETO_MASTER_KEY:-}
      # Model providers, models and their keys are configured IN THE INTERFACE
      # (Providers in the left rail) and stored in the database, encrypted
      # under the master key above. The environment carries no model
      # configuration.
      # Bulk import in-flight cap (V2.2 item 5.3): default 1, max 8.
      COGETO_IMPORT_IN_FLIGHT: ${COGETO_IMPORT_IN_FLIGHT:-}
      # The per-user daily upload quota an import PAUSES on rather than
      # bypasses (documented in .env.example; plumbed here with 5.3 so the
      # knob is reachable on a compose deployment).
      COGETO_DAILY_UPLOAD_MAX: ${COGETO_DAILY_UPLOAD_MAX:-}
      COGETO_LOG_LEVEL: ${COGETO_LOG_LEVEL:-info}
      # A customer instance is NEVER a sandbox: the demo
      # seed/reset hard-refuse when this is set.
      COGETO_PRODUCTION: '1'
      # Instance timezone — relative dates resolve against this zone.
      COGETO_TIMEZONE: ${COGETO_TIMEZONE:-Europe/Zagreb}
      # Inbound email (sender routing per decision
      # 0031): the instance's unique inbound address, size caps, and the shared
      # secret the Haraka queue hook presents to the internal intake
      # (fail-closed).
      COGETO_MAIL_INBOUND_ADDRESS: ${COGETO_MAIL_INBOUND_ADDRESS:?}
      COGETO_MAIL_MAX_BYTES: ${COGETO_MAIL_MAX_BYTES:-26214400}
      COGETO_MAIL_ATTACHMENTS_MAX_BYTES: ${COGETO_MAIL_ATTACHMENTS_MAX_BYTES:-26214400}
      COGETO_MAIL_INTAKE_TOKEN: ${COGETO_MAIL_INTAKE_TOKEN:?}
      # The bootstrap admin's login email — the operator account is excluded
      # from sender-routed email capture.
      COGETO_ADMIN_USER_EMAIL: ${ZITADEL_ADMIN_USERNAME:?}
      COGETO_MAIL_SMTP_ADDRESS: ${COGETO_MAIL_SMTP_ADDRESS:-mail:2525}
      # Web research (Priority 5,/0043): discovery via the
      # profile-gated SearXNG service below; with the profile down, research
      # answers a typed "search unavailable", nothing crashes.
      COGETO_SEARXNG_URL: ${COGETO_SEARXNG_URL:-http://searxng:8080}
      COGETO_RESEARCH_RESULT_CAP: ${COGETO_RESEARCH_RESULT_CAP:-8}
      COGETO_RESEARCH_SEARCH_TIMEOUT_SECONDS: ${COGETO_RESEARCH_SEARCH_TIMEOUT_SECONDS:-10}
      COGETO_RESEARCH_FETCH_TIMEOUT_SECONDS: ${COGETO_RESEARCH_FETCH_TIMEOUT_SECONDS:-15}
      COGETO_RESEARCH_FETCH_MAX_BYTES: ${COGETO_RESEARCH_FETCH_MAX_BYTES:-5242880}
      COGETO_RESEARCH_PAGES_PER_RUN: ${COGETO_RESEARCH_PAGES_PER_RUN:-5}
      COGETO_RESEARCH_RETAIN_HTML: ${COGETO_RESEARCH_RETAIN_HTML:-}
      COGETO_DAILY_RESEARCH_SEARCHES: ${COGETO_DAILY_RESEARCH_SEARCHES:-40}
      COGETO_DAILY_RESEARCH_PAGES: ${COGETO_DAILY_RESEARCH_PAGES:-100}
      # Per-tier timeouts for any SELF-HOSTED endpoint, and the reasoning
      # headroom multiplier (issue #567). These are the documented live knobs:
      # this file used to wire only the retired COGETO_OLLAMA_TIMEOUT_* alias
      # and drop all five of these, so an operator running a self-hosted
      # endpoint raised the documented timeout, restarted, and the value never
      # reached the process. A local runtime itself is configured in the
      # interface, never here.
      COGETO_MODEL_TIMEOUT_PIPELINE_MS: ${COGETO_MODEL_TIMEOUT_PIPELINE_MS:-}
      COGETO_MODEL_TIMEOUT_ANSWER_MS: ${COGETO_MODEL_TIMEOUT_ANSWER_MS:-}
      COGETO_MODEL_TIMEOUT_EMBEDDINGS_MS: ${COGETO_MODEL_TIMEOUT_EMBEDDINGS_MS:-}
      COGETO_MODEL_TIMEOUT_VISION_MS: ${COGETO_MODEL_TIMEOUT_VISION_MS:-}
      COGETO_REASONING_HEADROOM: ${COGETO_REASONING_HEADROOM:-}
      # Redaction mode (spec §12.2, profile redaction; issue #565). Off by
      # default. `cogeto features enable redaction` sets all three and adds the
      # profile: the sidecar below pseudonymizes every outbound model call, and
      # the gateway FAILS CLOSED if it is unreachable. Both the app and the
      # worker receive them because both make model calls; wiring only one is
      # the shape of bug that made hand-editing .env here do nothing at all.
      REDACTION_ENABLED: ${REDACTION_ENABLED:-}
      REDACTION_URL: ${REDACTION_URL:-http://redaction:8080}
      REDACTION_REQUIRED: ${REDACTION_REQUIRED:-}
      # Capability visibility (P6.7): the active profile list,
      # mirrored from COMPOSE_PROFILES in .env (maintained by the operator
      # script's `features` command), plus the jobs' overdue threshold.
      COGETO_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # SEC-14: inbound mail is opt-in; `cogeto features enable mail` sets both
      # the profile and this flag.
      COGETO_MAIL_ENABLED: ${COGETO_MAIL_ENABLED:-}
      COGETO_JOBS_OVERDUE_HOURS: ${COGETO_JOBS_OVERDUE_HOURS:-}
    volumes:
      - web-config:/web-config:ro
      #: the app mounts the PUBLIC-KEY-ONLY volume — an RCE in the
      # internet-facing app cannot exfiltrate the receipt-signing private key.
      - instance-pubkey:/instance-keys:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      # SEC-2: the app's scoped S3 credential is provisioned by minio-init.
      minio-init:
        condition: service_completed_successfully
      zitadel:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      zitadel-init:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 512
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Same image and user as app, and the same empty capability set. /tmp
    # holds the heartbeat file the healthcheck stats, and is the working room
    # for the reading ladder: pdftoppm and tesseract are driven through
    # stdin/stdout (files/reading/rasterize.ts, ocr.ts), so a 25 MB document
    # never lands there. Sized rather than unbounded because tmpfs pages
    # count against mem_limit above.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    image: cogeto/cogeto:${COGETO_VERSION:?}
    # Heap ceiling below mem_limit: 3g — see the note on `app`. The worker gets
    # the larger share because it is the process that parses 25 MB documents and
    # builds embedding batches, which is also the off-heap pressure the gap
    # between 2304m and 3g is there to absorb.
    command: ['node', '--max-old-space-size=2304', 'project/src/dist/entrypoints/worker.js']
    environment:
      <<: *cogeto-env
      #: graphile crons run in UTC so the nightly schedule is
      # timezone-stable across DST transitions.
      TZ: UTC
    volumes:
      # The worker keeps the FULL keypair (it signs receipts) —.
      - instance-keys:/instance-keys:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('fs').statSync('/tmp/worker-heartbeat');process.exit(Date.now()-s.mtimeMs<30000?0:1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      # SEC-2: the worker's scoped S3 credential is provisioned by minio-init.
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── One-shot init jobs ──────────────────────────────────────────────────────
  # Refuses to boot if a known DEV secret guards a non-localhost deployment
  #. The only process handed every secret, so it enforces the rule
  # instance-wide.
  preflight:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Reads the environment, prints a verdict, exits. No capability, no
    # writable path.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    image: cogeto/cogeto:${COGETO_VERSION:?}
    command: ['node', 'project/src/dist/entrypoints/preflight.js']
    environment:
      COGETO_EXTERNAL_DOMAIN: ${COGETO_EXTERNAL_DOMAIN:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # SEC-1/SEC-2 wave-3 credentials join the known-dev-secret refusal.
      COGETO_APP_DB_PASSWORD: ${COGETO_APP_DB_PASSWORD:?}
      COGETO_MIGRATE_DB_PASSWORD: ${COGETO_MIGRATE_DB_PASSWORD:?}
      ZITADEL_DB_ADMIN_PASSWORD: ${ZITADEL_DB_ADMIN_PASSWORD:?}
      COGETO_S3_SECRET_KEY: ${COGETO_S3_SECRET_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?}
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
      ZITADEL_ADMIN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?}
      # SEC-21: see the dev compose. Not `:?` — research is optional, so an
      # unset secret must not break `compose up` with the profile down.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      # The ACTIVE PROFILE LIST (audit F12). The empty default above is what let
      # an operator who added `research` to COMPOSE_PROFILES by hand run SearXNG
      # with no session secret: the dev-secret pass skips empty values by
      # design, so the preflight has to know which profiles are up to refuse it.
      COGETO_COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      COGETO_RESEARCH_ENABLED: ${COGETO_RESEARCH_ENABLED:-}
    restart: 'no'

  migrate:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Applies SQL and generates the instance keypair; both go to mounted
    # volumes, which stay writable under a read-only root.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    image: cogeto/cogeto:${COGETO_VERSION:?}
    command: ['node', 'project/src/dist/entrypoints/migrate.js']
    environment:
      <<: *cogeto-env
      # SEC-1: migrations run as the schema OWNER, never as the runtime role
      # and never as the superuser. After each run it re-converges cogeto_app's
      # table-level grants (infrastructure/migrations.ts).
      COGETO_DATABASE_URL: postgres://cogeto_migrate:${COGETO_MIGRATE_DB_PASSWORD:?}@postgres:5432/cogeto
      #: migrate also publishes the PUBLIC half into the app-only volume.
      COGETO_INSTANCE_PUBKEY_DIR: /instance-pubkey
    # The only writer of the instance keypair: generated here once, then the
    # PRIVATE half mounted read-only into the worker and the PUBLIC half into
    # the app (spec §11.1).
    volumes:
      - instance-keys:/instance-keys
      - instance-pubkey:/instance-pubkey
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      instance-keys-init:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
    restart: 'no'

  # Least-privilege Postgres identities (audit 2.0 SEC-1): creates/converges
  # cogeto_app (runtime, DML only), cogeto_migrate (schema owner, migrations
  # only) and zitadel_admin (Zitadel's bootstrap admin — CREATEDB/CREATEROLE,
  # not superuser), revokes PUBLIC connect on both databases, and adopts
  # objects a pre-wave-3 instance created as the superuser. Idempotent;
  # passwords re-sync from .env on every up (rotatable via `cogeto configure
  # --regenerate`). The ONLY service besides postgres itself that holds the
  # superuser credential. db-init.sql is a fetched deploy asset (same file as
  # project/infra/docker/postgres-init/db-init.sql, at the same version).
  db-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # psql against the postgres service and nothing else: no capability, and
    # the only writable path it needs is a temp directory.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # same digest as the postgres service, used for psql
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: cogeto
      COGETO_APP_DB_PASSWORD: ${COGETO_APP_DB_PASSWORD:?}
      COGETO_MIGRATE_DB_PASSWORD: ${COGETO_MIGRATE_DB_PASSWORD:?}
      ZITADEL_DB_ADMIN_PASSWORD: ${ZITADEL_DB_ADMIN_PASSWORD:?}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        psql -v ON_ERROR_STOP=1
        --set=app_password="$$COGETO_APP_DB_PASSWORD"
        --set=migrate_password="$$COGETO_MIGRATE_DB_PASSWORD"
        --set=zitadel_admin_password="$$ZITADEL_DB_ADMIN_PASSWORD"
        --set=zitadel_password="$$ZITADEL_DB_PASSWORD"
        -f /db-init/db-init.sql
    volumes:
      - ./postgres-init/db-init.sql:/db-init/db-init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      preflight:
        condition: service_completed_successfully
    restart: 'no'

  # The runtime image runs as uid 1000 (node); fresh named volumes are
  # root-owned. Hand both key volumes over before migrate generates the keypair.
  instance-keys-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Its whole job is `chown -R 1000:1000` on two fresh, root-owned volumes,
    # so CHOWN is granted and nothing else. It writes only through those
    # volume mounts.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    read_only: true
    image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ['chown', '-R', '1000:1000', '/instance-keys', '/instance-pubkey']
    volumes:
      - instance-keys:/instance-keys
      - instance-pubkey:/instance-pubkey
    restart: 'no'

  # Creates the bucket, turns on default SSE-S3 encryption, ASSERTS the bucket
  # reports encryption enabled, and provisions the SCOPED application
  # credential (SEC-2): a MinIO user limited to the object operations the app
  # actually performs on the cogeto bucket. The root credential exists ONLY
  # here (provisioning) and in the minio service itself; the app and worker
  # never see it. Idempotent and self-verifying: the final check asserts the
  # scoped credential works for object access and is REFUSED by the admin API.
  minio-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # mc talks to MinIO over the network and needs no capability. Two writable
    # paths: /tmp for the generated policy document, and $HOME for mc's own
    # alias config — both tmpfs, so the root credential mc caches in
    # ~/.mc/config.json never touches a disk that outlives the container.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /root:size=16m,mode=0700
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    environment:
      COGETO_S3_ACCESS_KEY: ${COGETO_S3_ACCESS_KEY:-cogeto-app}
      COGETO_S3_SECRET_KEY: ${COGETO_S3_SECRET_KEY:?}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000
        "${MINIO_ROOT_USER:?}" "${MINIO_ROOT_PASSWORD:?}" &&
        mc mb --ignore-existing local/cogeto &&
        mc encrypt set sse-s3 local/cogeto &&
        case "$$(mc encrypt info local/cogeto)" in *sse-s3*)
        echo "bucket cogeto ready (SSE-S3 default encryption verified)";; *)
        echo "FATAL: bucket encryption could not be enabled/verified" >&2; exit 1;;
        esac &&
        printf '%s' '{"Version":"2012-10-17","Statement":[
        {"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],
        "Resource":["arn:aws:s3:::cogeto/*"]},
        {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:GetEncryptionConfiguration"],
        "Resource":["arn:aws:s3:::cogeto"]}]}' > /tmp/cogeto-app-policy.json &&
        mc admin policy create local cogeto-app-rw /tmp/cogeto-app-policy.json &&
        mc admin user add local "$$COGETO_S3_ACCESS_KEY" "$$COGETO_S3_SECRET_KEY" &&
        { mc admin policy attach local cogeto-app-rw --user "$$COGETO_S3_ACCESS_KEY" 2>/dev/null || true; } &&
        case "$$(mc admin user info local "$$COGETO_S3_ACCESS_KEY")" in *cogeto-app-rw*) : ;; *)
        echo "FATAL: cogeto-app-rw policy is not attached to the scoped user" >&2; exit 1;;
        esac &&
        mc alias set scoped http://minio:9000 "$$COGETO_S3_ACCESS_KEY" "$$COGETO_S3_SECRET_KEY" &&
        mc ls scoped/cogeto >/dev/null &&
        if mc admin info scoped >/dev/null 2>&1; then
        echo "FATAL: the scoped app credential can reach the MinIO admin API" >&2; exit 1;
        else echo "scoped app credential ready (object access verified, admin API refused)"; fi
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  # The zitadel image runs as uid 1000; hand its bootstrap-PAT volume over.
  machinekey-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Same one job as instance-keys-init, on the Zitadel machinekey volume.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    read_only: true
    image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ['chown', '-R', '1000:1000', '/machinekey']
    volumes:
      - zitadel-machinekey:/machinekey
    restart: 'no'

  zitadel-init:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Runs as root but writes into /machinekey, which machinekey-init handed
    # to uid 1000 so Zitadel could write pat.txt: root without DAC_OVERRIDE
    # does NOT bypass directory permissions, so revoking the PAT and writing
    # bootstrap-state.json needs precisely that one capability. Running it as
    # 1000 instead is not the trade: it would then be unable to write
    # /web-config, a fresh root-owned volume.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    image: node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    command: ['node', '/init/init.mjs']
    environment:
      ZITADEL_INTERNAL_URL: http://zitadel:8080
      ZITADEL_EXTERNAL_DOMAIN: ${COGETO_EXTERNAL_DOMAIN:?}
      COGETO_ISSUER: https://${COGETO_EXTERNAL_DOMAIN}
      COGETO_REDIRECT_URI: https://${COGETO_EXTERNAL_DOMAIN}/callback
      COGETO_POST_LOGOUT_URI: https://${COGETO_EXTERNAL_DOMAIN}/
      ZITADEL_PAT_FILE: /machinekey/pat.txt
      COGETO_WEB_CONFIG_FILE: /web-config/config.json
      # The bootstrap machine identity and the file that records "provisioning
      # already succeeded" (issue #568: both were read by init.mjs and named in
      # no compose and no document, so their paths were only knowable from the
      # source — and the runbook's domain-change procedure depends on the state
      # file's path). Passed with the defaults init.mjs already used: this
      # changes no behaviour, it makes the values visible.
      ZITADEL_BOOTSTRAP_MACHINE_USERNAME: ${ZITADEL_BOOTSTRAP_MACHINE_USERNAME:-cogeto-bootstrap}
      ZITADEL_BOOTSTRAP_STATE_FILE: ${ZITADEL_BOOTSTRAP_STATE_FILE:-/machinekey/bootstrap-state.json}
      #: grant the FirstInstance admin the operator role so the System
      # view works out of the box (must match the app's COGETO_ADMIN_ROLE).
      ZITADEL_ADMIN_USERNAME: ${ZITADEL_ADMIN_USERNAME:?}
      COGETO_ADMIN_ROLE: ${COGETO_ADMIN_ROLE:-admin}
    volumes:
      # init.mjs is part of the fetched deploy assets (same file as
      # project/infra/docker/zitadel-init/init.mjs, at the same version).
      - ./zitadel-init:/init:ro
      # Writable (was :ro): after provisioning succeeds the init REVOKES the
      # bootstrap PAT, blanks pat.txt and records the provisioned state in
      # bootstrap-state.json (SEC-16). A customer instance never runs the demo
      # profile, so nothing here needs the PAT after bootstrap.
      - zitadel-machinekey:/machinekey
      - web-config:/web-config
    depends_on:
      zitadel:
        condition: service_healthy
    restart: 'no'

  # ── Infrastructure ──────────────────────────────────────────────────────────
  # All infra images are PINNED BY DIGEST; the tag is kept in the reference.
  postgres:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # The official entrypoint starts as root, prepares and chowns PGDATA and
    # then drops to the postgres user, which is what CHOWN + DAC_OVERRIDE +
    # FOWNER + SETGID + SETUID are for; the server itself runs unprivileged
    # after that. Not read-only: it writes its socket directory, its stats
    # and its temp files outside the data volume, and a database that fails
    # on an uncommon write path is worse than an unhardened one.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: cogeto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cogeto']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  qdrant:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # No capability: it serves the index from its volume and binds 6333.
    # NOT read-only, and this one was measured rather than assumed: with a
    # read-only root it logs `Failed to create init file indicator:
    # .qdrant-initialized: Read-only file system` and then panics at startup.
    # Its working directory is inside the image root, so the marker and the
    # snapshot directory cannot be moved onto a tmpfs without shadowing the
    # config directory that lives beside them.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    # API-key auth is ALWAYS ON in the deploy stack — the app/worker
    # clients send COGETO_QDRANT_API_KEY automatically.
    environment:
      QDRANT__SERVICE__API_KEY: ${COGETO_QDRANT_API_KEY:?}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Object storage writes its data and its .minio.sys metadata inside the
    # volume; nothing else on the root filesystem. No capability needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    image: cogeto/silo:RELEASE.2026-08-06T00-00-00Z@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
    # No console vhost is exposed on a customer instance (the consoles profile
    # is dev-only); the console listener stays internal.
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Server-side encryption at rest: single-node KMS
      # backed by one named static key, generated per instance by the operator
      # script. Losing it makes stored objects unreadable — it is in the
      # instance secrets the operator must vault.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  zitadel:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Already runs as uid 1000 and binds 8080; state lives in Postgres and
    # the machinekey volume, so the root filesystem can be read-only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    image: ghcr.io/zitadel/zitadel:v2.71.19@sha256:32834d46240c5ece9f86c5e5f706b167c2064fba76bbf9213e3494023c38ca5d
    #: masterkey via env, never on the command line.
    command: 'start-from-init --masterkeyFromEnv --tlsMode external'
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?}
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      # SEC-1: Zitadel's bootstrap/migration admin is its own non-superuser
      # role (CREATEDB/CREATEROLE, provisioned by db-init) — no longer the
      # cluster superuser, and a credential the app never holds.
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel_admin
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_ADMIN_PASSWORD:?}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: ${COGETO_EXTERNAL_DOMAIN:?}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: 'true'
      # TLS terminates at the edge; this also keeps the ready probe on HTTP.
      ZITADEL_TLS_ENABLED: 'false'
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-Cogeto}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:?}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: 'false'
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Cogeto
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: 'true'
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: cogeto-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Cogeto Bootstrap
      # SEC-16: short-expiry bootstrap PAT, generated per install by the
      # operator script (install date + 14 days); zitadel-init additionally
      # REVOKES it the moment provisioning succeeds. FIRSTINSTANCE config only
      # applies on first init, so this never affects an existing instance.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_BOOTSTRAP_PAT_EXPIRY:?}
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
      ZITADEL_DEFAULTINSTANCE_LABELPOLICY_DISABLEWATERMARK: 'true'
    volumes:
      - zitadel-machinekey:/machinekey
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      # SEC-1: the zitadel_admin role must exist before Zitadel's own init.
      db-init:
        condition: service_completed_successfully
      machinekey-init:
        condition: service_completed_successfully
      preflight:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Web discovery (profile research;/0055) ───────────────────
  # Self-hosted SearXNG, one of the three optional profiles in the deploy channel: a
  # digest-pinned upstream image (same digest as the dev stack —), so it
  # stays pull-only. Internal-network only (no published ports; the edge never
  # proxies it); reachable at http://searxng:8080. Enable/disable with
  # `cogeto features enable research` — it maintains COMPOSE_PROFILES in .env
  # and fetches ./searxng/settings.yml with the other deploy assets.
  searxng:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # The image's entrypoint starts as root, fixes ownership under
    # /etc/searxng and drops to the searxng user before serving, which is what
    # these four are for. Not read-only: that entrypoint writes a settings
    # file beside the one mounted here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    profiles: ['research']
    image: searxng/searxng:2026.8.14-094c33d40@sha256:892cf809341915a4b7710d3c9045005b4c377d51335a089b6d4da0b28750788d
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # NOT the `${VAR:?}` form: compose interpolates the whole file before
      # profile filtering, so a required var here would break `compose up` even
      # with research off. `cogeto features enable research` generates it.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # The second half of the F12 refusal, inside the service itself: an empty
    # secret makes this container UNHEALTHY rather than quietly serving with
    # unsigned sessions. The preflight is the instance-wide gate; this one also
    # catches a `docker compose up searxng` that never runs it.
    healthcheck:
      test:
        - CMD-SHELL
        - '[ -n "$$SEARXNG_SECRET" ] || { echo "SEARXNG_SECRET is empty — refusing to report healthy"; exit 1; }; wget -q --spider http://127.0.0.1:8080/healthz'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ── Redaction sidecar (profile redaction; spec §12.2, issue #565) ───────────
  #
  # Local CPU NER (Presidio) that pseudonymizes sensitive entities before any
  # external model call and re-identifies the response: "PII never leaves your
  # box, even though a frontier model answers you." Stateless: no database, no
  # volumes. Internal-network only (no published ports); reachable at
  # http://redaction:8080, and the edge never proxies it.
  #
  #   cogeto features enable redaction
  #
  # The profile brings the sidecar up; REDACTION_ENABLED (set by the same
  # command) flips the gateway decorator on and REDACTION_REQUIRED makes the
  # boot refuse to run without it. Enabled and unreachable means model calls
  # FAIL CLOSED, never plaintext.
  #
  # This service was deliberately absent from the deploy channel while its
  # image was unpublished; the release pipeline now builds, pushes, signs and
  # attests cogeto/cogeto-redaction beside the other three, so a pull-only
  # instance has something to pull.
  redaction:
    # Resource ceiling (audit 2.0 SEC-17) — the note above `services:` already
    # budgets 2g for this sidecar (~0.7-1 GB RSS for spaCy en_core_web_lg,
    # doubled); it is the single largest addition to the instance's footprint.
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # The sidecar is stateless by design (its own Dockerfile says so): non-root
    # uid 1000, no capability, no writable path but a temp directory. It is
    # also the service handling the most sensitive text on the box, so it gets
    # the strictest posture of the three optional profiles.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    profiles: ['redaction']
    image: cogeto/cogeto-redaction:${COGETO_VERSION:?}
    environment:
      SPACY_MODEL: ${REDACTION_SPACY_MODEL:-en_core_web_lg}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  # ── Inbound mail (roadmap D2) ────────────────────
  # Per-tenant, RECEIVE-ONLY Haraka SMTP. The allowlist (the real acceptance
  # gate) lives in the app; DNS/MX wiring is printed by the operator script's
  # checklist (docs/operations/email-inbound.md).
  mail:
    # Resource ceiling (audit 2.0 SEC-17) — see the note above `services:`.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # The one to think hardest about: internet-facing, and the host publishes
    # port 25 at it. It still needs NO capability, because the privileged port
    # is on the HOST side of the port mapping — inside the container Haraka
    # binds 2525 as the image's non-root `node` user. Not read-only: the
    # entrypoint writes host_list, me, databytes, tls.ini and the DH
    # parameters into its config directory at start, and Haraka writes its
    # queue; a read-only root would break STARTTLS specifically, which is the
    # path that fails quietly.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # SEC-14: OFF by default — an instance that does not use email capture no
    # longer runs an internet-facing SMTP listener, and the operator script no
    # longer opens 25/tcp in ufw. Turn it on with `cogeto features enable mail`,
    # which adds the profile to COMPOSE_PROFILES, opens the firewall port and
    # prints the DNS/MX steps.
    profiles: ['mail']
    image: cogeto/cogeto-mail:${COGETO_VERSION:?}
    environment:
      COGETO_MAIL_INBOUND_ADDRESS: ${COGETO_MAIL_INBOUND_ADDRESS:?}
      COGETO_MAIL_MAX_BYTES: ${COGETO_MAIL_MAX_BYTES:-26214400}
      COGETO_INTAKE_URL: http://app:3000/api/email/intake
      COGETO_MAIL_INTAKE_TOKEN: ${COGETO_MAIL_INTAKE_TOKEN:?}
      # Inbound STARTTLS: the entrypoint enables Haraka's tls plugin only when
      # a readable cert/key is present at these paths in the mail-tls volume,
      # and it watches them, so a renewal is picked up without anyone doing
      # anything. The mail-tls-sync sidecar below is what puts them there
      # (issue #566). A DEDICATED volume, NOT the whole caddy-data store: the
      # internet-facing mail container must never hold the edge's other keys.
      COGETO_MAIL_TLS_CERT: ${COGETO_MAIL_TLS_CERT:-/app/tls/cert.pem}
      COGETO_MAIL_TLS_KEY: ${COGETO_MAIL_TLS_KEY:-/app/tls/key.pem}
    volumes:
      - mail-tls:/app/tls:ro
    ports:
      # Standard inbound SMTP → the container's non-root listener.
      - '${COGETO_MAIL_HOST_PORT:-25}:2525'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(2525,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # ── Inbound-mail TLS propagation (profile mail; issue #566) ─────────────────
  #
  # The producing half of inbound-mail TLS. The edge obtains and renews the
  # certificate for `mail.<domain>` (the ACME-only vhost in ./Caddyfile); this
  # container copies it into the mail service's own volume with the ownership
  # the non-root Haraka user needs, and only when the material actually
  # changed. The mail entrypoint watches its own copy and restarts itself to
  # load a renewal, which is why nothing here holds the Docker socket.
  #
  # It runs the EDGE image (already published and signed, and the image that
  # owns the certificate store) with a different entrypoint, rather than adding
  # a fifth release image for twenty lines of shell.
  #
  # The boundary that made this a sidecar rather than a mount: `mail` gets
  # `mail-tls` only, never `caddy-data`. This container reads caddy-data
  # READ-ONLY and publishes exactly two files onward.
  mail-tls-sync:
    # Resource ceiling (audit 2.0 SEC-17) — a sleeping shell loop that hashes
    # two PEM files every five minutes.
    mem_limit: 64m
    cpus: 1.0
    pids_limit: 64
    # ── Privilege hardening (issue #591) ────────────────────────────────────
    # Copies two PEM files from the edge's store into the mail volume and
    # chowns them to the mail user (uid 1000) — CHOWN is the whole reason it
    # is not empty. It reads caddy-data read-only and writes only through the
    # mail-tls mount.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    read_only: true
    profiles: ['mail']
    image: cogeto/cogeto-edge:${COGETO_VERSION:?}
    entrypoint: ['/usr/local/bin/cogeto-mail-tls-sync']
    environment:
      # Same value, same derivation as the edge's ACME vhost above.
      COGETO_MAIL_TLS_SITE: ${COGETO_MAIL_TLS_SITE:-}
      # Who owns the certificate: `automatic` (this sidecar installs the one the
      # edge obtained) or `operator` (the material in the volume is the
      # operator's own, and this sidecar idles and overwrites nothing). Written
      # by `cogeto configure --mail-tls-mode MODE`.
      COGETO_MAIL_TLS_MODE: ${COGETO_MAIL_TLS_MODE:-automatic}
    volumes:
      - caddy-data:/data:ro
      - mail-tls:/mail-tls
    depends_on:
      caddy:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  qdrant-data:
  minio-data:
  # The receipt-signing keypair lives ONLY here (generated on first boot by
  # migrate) — it is covered by OVHcloud volume backups, never by files on disk.
  instance-keys:
  instance-pubkey:
  zitadel-machinekey:
  web-config:
  caddy-data:
  caddy-config:
  # Instance TLS cert/key for inbound STARTTLS. Populated automatically by
  # mail-tls-sync from the certificate the edge obtains for the mail hostname
  # (issue #566); empty → no STARTTLS, and status says so. An operator with
  # their own CA may place cert.pem + key.pem here by hand instead
  # (docs/operations/email-inbound.md documents the override and its
  # ownership requirement).
  mail-tls:
